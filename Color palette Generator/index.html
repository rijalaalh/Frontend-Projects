<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color palette Generator</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/ec6eb14317.js"
      crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="container">
        <h1>Color Palette Generator</h1>
      <button id="generate-btn">
        <i class="fa-solid fa-rotate"></i> Generate Palette
      </button>
      <div class="palette-container">
        <!-- color box 1 -->
        <div class="color-box">
            <div class="color" style="background-color: #e1f5fe"></div>
          <div class="color-info">
            <span class="hex-value">#f00</span>
            <i class="fa-solid fa-copy copy-btn" title="COPY TO DASHBORD"></i>
            <i class="fa-solid fa-check check-icon" style="display: none;"></i>
          </div>
        </div>
        <!-- color box 2 -->
        <div class="color-box">
            <div class="color" style="background-color: #e1f5fe"></div>
            <i class="fa-solid fa-check check-icon" style="display: none;"></i>

          <div class="color-info">
            <span class="hex-value">#f00</span>
            <i class="fa-solid fa-copy copy-btn" title="COPY TO DASHBORD"></i>
            <i class="fa-solid fa-check check-icon" style="display: none;"></i>

          </div>
        </div>
        <!-- color box 3 -->
        <div class="color-box">
            <div class="color" style="background-color: #e1f5fe"></div>
          <div class="color-info">
            <span class="hex-value">#f00</span>
            <i class="fa-solid fa-copy copy-btn" title="COPY TO DASHBORD"></i>
            <i class="fa-solid fa-check check-icon" style="display: none;"></i>

          </div>
        </div>
        <!-- color box 4 -->
        <div class="color-box">
            <div class="color" style="background-color: #e1f5fe"></div>
          <div class="color-info">
            <span class="hex-value">#f00</span>
            <i class="fa-solid fa-copy copy-btn" title="COPY TO DASHBORD"></i>
            <i class="fa-solid fa-check check-icon" style="display: none;"></i>

          </div>
        </div>
        <!-- color box 5 -->
        <div class="color-box">
            <div class="color" style="background-color: #e1f5fe"></div>
          <div class="color-info">
            <span class="hex-value">#f00</span>
            <i class="fa-solid fa-copy copy-btn" title="COPY TO DASHBORD"></i>
            <i class="fa-solid fa-check check-icon" style="display: none;"></i>

          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
