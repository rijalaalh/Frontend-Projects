<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>
        <div class="balance-container">
            <h2>Your Balance</h2>
            <h1 id="balance">$0.00</h1>
            <div class="summry">
                <div class="income">
                    <h3>Income</h3>
                    <p class="income-amount" id="income-amount">$0.000</p>
                </div>
                <div class="expenses">
                    <h3>Expenses</h3>
                    <p class="expense-amount" id="expense-amount">$0.000</p>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="transaction-container">
                <h2>Transactions</h2>
                <ul id="transaction-list">
                    <!--  -->
                </ul>
            </div>
            <div class="form-container">
                <h2>Add Transaction</h2>
                <form action="" id="transaction-form">
                    <div class="form-group">
                        <label for="">Description</label>
                        <input type="text" placeholder="Enter description ..." required id="description"/>
                    </div>
                    <div class="form-group">
                        <label for="">Amount</label>
                        <input type="number" placeholder="Enter Amount ..." required id="amount"/>
                        <small>use negative (-) for expenses</small>
                    </div>
                    <button type="submit">Add Transaction</button>
                </form>
            </div>
        </div>
    </div>
<script src="script.js"></script>
</body>

</html>
